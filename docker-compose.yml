version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: lootere_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: lootere_db
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: lootere_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lootere_backend
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - mongodb
      - redis

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: lootere_bot
    restart: always
    env_file: .env
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: lootere_worker
    restart: always
    command: python -m worker.main
    env_file: .env
    depends_on:
      - redis
      - mongodb

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: lootere_beat
    restart: always
    command: python -m worker.main beat
    env_file: .env
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lootere_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: lootere_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

volumes:
  mongo_data:
  redis_data:
