server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /api/v1/stream/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_force_ranges on;
    }
}
